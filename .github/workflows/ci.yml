name: ThinkBuddy CI

on:
  push:
    branches: ["main", "feat/*"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Ruff Linting
        run: ruff check core gateway workers rag

      - name: Run Ruff Format Check
        run: ruff format --check core gateway workers rag

      - name: Run Mypy Typecheck
        run: mypy core gateway workers rag

      - name: Run Bandit Security Analysis
        run: bandit -r core gateway workers rag -ll

      - name: Run Pip-Audit Dependency Vulnerability Scanner
        run: pip-audit

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_DB: thinkbuddy
          POSTGRES_USER: thinkbuddy
          POSTGRES_PASSWORD: thinkbuddy_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thinkbuddy -d thinkbuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://thinkbuddy:thinkbuddy_dev_password@127.0.0.1:5432/thinkbuddy
      DATABASE_URL_SYNC: postgresql://thinkbuddy:thinkbuddy_dev_password@127.0.0.1:5432/thinkbuddy
      REDIS_URL: redis://127.0.0.1:6379/0
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: thinkbuddy
      POSTGRES_USER: thinkbuddy
      POSTGRES_PASSWORD: thinkbuddy_dev_password
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Database Migrations
        run: |
          python -c "import psycopg2; conn = psycopg2.connect('postgresql://thinkbuddy:thinkbuddy_dev_password@127.0.0.1:5432/thinkbuddy'); conn.autocommit = True; cur = conn.cursor(); cur.execute('CREATE EXTENSION IF NOT EXISTS vector;'); cur.execute('CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(128) NOT NULL PRIMARY KEY);')"
          alembic upgrade head

      - name: Run Tests with Coverage
        run: pytest -v --cov=core --cov=gateway --cov=rag tests/

      - name: Export OpenAPI Schema
        run: python scripts/export_openapi.py

      - name: Verify OpenAPI Artifact Exists
        run: test -f docs-generated/openapi.json

      - name: Verify Compose Images Are Pinned and Pullable
        run: python scripts/check_images.py

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Run Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep scan --config p/python --config p/typescript --config p/dockerfile --metrics=off --error --exclude node_modules --exclude .next --exclude data --exclude fixtures --exclude tests/data

  trivy:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Core Container Image
        run: docker build -t thinkbuddyarc-core:ci -f infra/docker/Dockerfile.core .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: thinkbuddyarc-core:ci
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  android:
    name: Android Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: cd android && ./gradlew testDebugUnitTest
