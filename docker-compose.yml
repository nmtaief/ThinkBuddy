version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: thinkbuddy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thinkbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-thinkbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thinkbuddy_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkbuddy -d thinkbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thinkbuddy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: thinkbuddy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_dev_access_key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_dev_secret_key}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: thinkbuddy-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  core:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.core
    container_name: thinkbuddy-core
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CORE_HOST: 0.0.0.0
      CORE_PORT: 8001
      DATABASE_URL: postgresql+asyncpg://thinkbuddy:thinkbuddy_dev_password@postgres:5432/thinkbuddy
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev_internal_service_token_placeholder_change_in_production}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gateway
    container_name: thinkbuddy-gateway
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      CORE_INTERNAL_URL: http://core:8001
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev_internal_service_token_placeholder_change_in_production}
    ports:
      - "8000:8000"
    depends_on:
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  workers:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.workers
    container_name: thinkbuddy-workers
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://thinkbuddy:thinkbuddy_dev_password@postgres:5432/thinkbuddy
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
