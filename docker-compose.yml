services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    container_name: thinkbuddy-postgres
    restart: unless-stopped
    command: postgres -c max_connections=250 -c shared_buffers=256MB -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thinkbuddy}
      POSTGRES_USER: ${POSTGRES_USER:-thinkbuddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thinkbuddy_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkbuddy -d thinkbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.11-alpine
    container_name: thinkbuddy-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  silo:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z@sha256:2636fc4155d9a7e41ff58cdb65ddd13ba9304e67184e13c25bc5cb34016269d7
    container_name: thinkbuddy-silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${S3_ACCESS_KEY_ID:-minio_dev_access_key}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${S3_SECRET_ACCESS_KEY:-minio_dev_secret_key}}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: thinkbuddy-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI

  core:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.core
    container_name: thinkbuddy-core
    restart: unless-stopped
    command: ["uvicorn", "core.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "4"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: INFO
      CORE_HOST: 0.0.0.0
      CORE_PORT: 8001
      DATABASE_URL: postgresql+asyncpg://thinkbuddy:thinkbuddy_dev_password@postgres:5432/thinkbuddy
      DB_POOL_SIZE: 25
      DB_MAX_OVERFLOW: 15
      DB_POOL_TIMEOUT: 15.0
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev_internal_service_token_placeholder_change_in_production}
      GATEWAY_TRUSTED_PROXIES: '["127.0.0.1", "::1", "172.28.0.0/29", "172.18.0.0/16"]'
    volumes:
      - ./core:/app/core
      - ./migrations:/app/migrations
      - ./rag:/app/rag
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gateway
    container_name: thinkbuddy-gateway
    restart: unless-stopped
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: INFO
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8000
      CORE_INTERNAL_URL: http://core:8001
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev_internal_service_token_placeholder_change_in_production}
      GATEWAY_TRUSTED_PROXIES: '["127.0.0.1", "::1", "172.28.0.0/29", "172.18.0.0/16"]'
    volumes:
      - ./gateway:/app/gateway
      - ./core:/app/core
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  workers:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.workers
    container_name: thinkbuddy-workers
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://thinkbuddy:thinkbuddy_dev_password@postgres:5432/thinkbuddy
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  silo_data:
