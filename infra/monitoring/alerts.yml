groups:
  - name: thinkbuddy_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "Target {{ $labels.job }} ({{ $labels.instance }}) has been unreachable for more than 1 minute."

      - alert: High5xxErrorRate
        expr: (sum(rate(thinkbuddy_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(thinkbuddy_http_requests_total[5m]))) * 100 > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate (> 1%)"
          description: "5xx error rate is {{ $value | printf \"%.2f\" }}% over the last 5 minutes."

      - alert: HighLatencyChat
        expr: histogram_quantile(0.95, sum(rate(thinkbuddy_chat_first_token_latency_seconds_bucket[5m])) by (le)) > 2.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Chat first-token latency p95 > 2.5s"
          description: "Chat p95 first token latency is {{ $value | printf \"%.2f\" }}s, exceeding the 2.5s target."

      - alert: HighLatencyAPI
        expr: histogram_quantile(0.95, sum(rate(thinkbuddy_http_request_duration_seconds_bucket{endpoint!~".*chat.*"}[5m])) by (le)) > 0.4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Non-chat API latency p95 > 400ms"
          description: "Non-chat API p95 response time is {{ $value | printf \"%.3f\" }}s, exceeding the 400ms SLA target."
