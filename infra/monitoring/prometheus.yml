global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'thinkbuddy-gateway'
    static_configs:
      - targets: ['gateway:8000']
    metrics_path: '/metrics'

  - job_name: 'thinkbuddy-core'
    static_configs:
      - targets: ['core:8001']
    metrics_path: '/metrics'

  - job_name: 'thinkbuddy-postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'thinkbuddy-redis'
    static_configs:
      - targets: ['redis:6379']
