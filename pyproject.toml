[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "gateway*", "rag*", "workers*"]

[project]
name = "thinkbuddy"
version = "0.1.0"
description = "ThinkBuddy learning platform backend and gateway"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.32",
    "greenlet>=3.0.3",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pgvector>=0.3.2",
    "celery>=5.4.0",
    "pyjwt>=2.15.0",
    "prometheus-client>=0.20.0",
    "cryptography>=43.0.0",
    "minio>=7.2.0",
    "packaging>=24.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.12.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "pre-commit>=3.8.0",
    "hypothesis>=6.112.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "S104", # possible binding to all interfaces (0.0.0.0 in Docker is standard)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"] # Allow assert and hardcoded test tokens in tests
"migrations/*" = ["E402", "E501"] # Allow sys.path setup and long DDL lines in migrations
"rag/vector_store.py" = ["S608"] # Parameterized dynamic clauses in vector store


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
